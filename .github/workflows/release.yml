name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Verify release tag is contained in main
        shell: bash
        run: |
          git fetch origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release refused: tag $GITHUB_REF_NAME points to $GITHUB_SHA, which is not contained in main."
            echo "Merge the release branch into main first, then create the version tag from that release commit."
            exit 1
          fi

  build:
    needs: release-source
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: threadmoth-linux-x86_64
            target: x86_64-unknown-linux-gnu
            binary: threadmoth
            profile: release
            rustflags: ''
            flavor: portable
            cpu_baseline: default
          - os: windows-latest
            artifact: threadmoth-windows-x86_64
            target: x86_64-pc-windows-msvc
            binary: threadmoth.exe
            profile: release
            rustflags: ''
            flavor: portable
            cpu_baseline: default
          - os: macos-14
            artifact: threadmoth-macos-aarch64
            target: aarch64-apple-darwin
            binary: threadmoth
            profile: release
            rustflags: ''
            flavor: portable
            cpu_baseline: apple-m1/default-target
          - os: macos-15-intel
            artifact: threadmoth-macos-x86_64
            target: x86_64-apple-darwin
            binary: threadmoth
            profile: release
            rustflags: ''
            flavor: portable
            cpu_baseline: default
          - os: ubuntu-latest
            artifact: threadmoth-linux-x86_64-v3
            target: x86_64-unknown-linux-gnu
            binary: threadmoth
            profile: maxperf
            rustflags: '-C target-cpu=x86-64-v3'
            flavor: modern
            cpu_baseline: x86-64-v3
          - os: windows-latest
            artifact: threadmoth-windows-x86_64-v3
            target: x86_64-pc-windows-msvc
            binary: threadmoth.exe
            profile: maxperf
            rustflags: '-C target-cpu=x86-64-v3'
            flavor: modern
            cpu_baseline: x86-64-v3
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
      THREADMOTH_BUILD_FLAVOR: ${{ matrix.flavor }}
      THREADMOTH_CPU_BASELINE: ${{ matrix.cpu_baseline }}
      THREADMOTH_PGO_USED: false
      THREADMOTH_OPTIMIZATION_PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --locked --profile ${{ matrix.profile }} --target ${{ matrix.target }}
      - run: cargo run --locked --profile ${{ matrix.profile }} --target ${{ matrix.target }} -- benchmark --quick --json
      - run: cargo run --locked --profile ${{ matrix.profile }} --target ${{ matrix.target }} -- benchmark --torture --json
      - run: cargo run --locked --profile ${{ matrix.profile }} --target ${{ matrix.target }} -- --version
      - run: cargo run --locked --profile ${{ matrix.profile }} --target ${{ matrix.target }} -- doctor
      - name: Package Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p package/completions
          cp target/${{ matrix.target }}/${{ matrix.profile }}/${{ matrix.binary }} package/${{ matrix.binary }}
          target/${{ matrix.target }}/${{ matrix.profile }}/${{ matrix.binary }} completions bash > package/completions/threadmoth.bash
          target/${{ matrix.target }}/${{ matrix.profile }}/${{ matrix.binary }} completions zsh > package/completions/_threadmoth
          target/${{ matrix.target }}/${{ matrix.profile }}/${{ matrix.binary }} completions fish > package/completions/threadmoth.fish
          target/${{ matrix.target }}/${{ matrix.profile }}/${{ matrix.binary }} manpage --output package/threadmoth.1
          test -s package/${{ matrix.binary }}
          expected="threadmoth ${GITHUB_REF_NAME#v}"
          test "$(package/${{ matrix.binary }} --version)" = "$expected"
          tar -czf ${{ matrix.artifact }}.tar.gz -C package .
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          New-Item -ItemType Directory -Force package/completions | Out-Null
          Copy-Item target/${{ matrix.target }}/${{ matrix.profile }}/threadmoth.exe package/threadmoth.exe
          target/${{ matrix.target }}/${{ matrix.profile }}/threadmoth.exe completions powershell | Out-File -Encoding utf8 package/completions/threadmoth.ps1
          target/${{ matrix.target }}/${{ matrix.profile }}/threadmoth.exe manpage --output package/threadmoth.1
          if ((Get-Item package/threadmoth.exe).Length -le 0) { throw 'packaged binary is empty' }
          $expected = 'threadmoth ' + $env:GITHUB_REF_NAME.TrimStart('v')
          if ((target/${{ matrix.target }}/${{ matrix.profile }}/threadmoth.exe --version) -ne $expected) { throw "packaged version mismatch: expected $expected" }
          Compress-Archive -Path package/* -DestinationPath "${{ matrix.artifact }}.zip"
      - name: Checksums Unix
        if: runner.os != 'Windows'
        run: shasum -a 256 "${{ matrix.artifact }}.tar.gz" > "${{ matrix.artifact }}.sha256"
      - name: Checksums Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: (Get-FileHash "${{ matrix.artifact }}.zip" -Algorithm SHA256).Hash.ToLower() + "  ${{ matrix.artifact }}.zip" | Out-File -Encoding ascii "${{ matrix.artifact }}.sha256"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.*

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Write release manifest
        shell: bash
        run: |
          mkdir -p dist/unpacked
          tar -xzf dist/threadmoth-linux-x86_64.tar.gz -C dist/unpacked
          protocol_version=$(dist/unpacked/threadmoth capabilities --json --all | jq -r '.protocol_version')
          printf '%s\n' '{' '  "protocol_version": "'"$protocol_version"'",' '  "artifacts": [' > dist/release-manifest.json
          first=1
          for file in dist/threadmoth-*.*; do
            case "$file" in *.sha256|*.json) continue;; esac
            hash=$(sha256sum "$file" | cut -d' ' -f1)
            [ "$first" -eq 1 ] || printf '%s\n' ',' >> dist/release-manifest.json
            printf '    {"name":"%s","sha256":"%s"}' "$(basename "$file")" "$hash" >> dist/release-manifest.json
            first=0
          done
          printf '%s\n' '  ]' '}' >> dist/release-manifest.json
          rm -rf dist/unpacked
      - uses: softprops/action-gh-release@v3.0.3
        with:
          files: dist/*
