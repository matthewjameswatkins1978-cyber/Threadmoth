name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release
      - run: cargo run --locked --release -- benchmark --quick --json
      - run: cargo run --locked --release -- benchmark --torture --json
      - run: cargo run --locked --release -- --version
      - run: cargo run --locked --release -- doctor
      - run: cargo run --locked --release -- doctor --json
      - run: cargo run --locked --release -- capabilities
      - run: cargo run --locked --release -- capabilities --json --all
      - run: cargo run --locked --release -- examples exact-text-replacement
      - run: cargo run --locked --release -- schema
      - run: cargo run --locked --release -- schema request --json
      - run: cargo run --locked --release -- explain TARGET_AMBIGUOUS --json
      - run: cargo run --locked --release -- suggest Cargo.toml --goal set-value --at package.name
      - run: target/release/threadmoth completions bash > threadmoth.bash
      - run: cargo run --locked --release -- manpage --output threadmoth.1
      - run: cargo run --locked --release -- benchmark tough --json
      - run: cargo run --locked --release -- torture --json
      - run: cargo run --locked --release -- --help
