name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Install ast-grep (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -sSL -o /tmp/ast-grep.zip https://github.com/ast-grep/ast-grep/releases/download/0.45.3/app-x86_64-unknown-linux-gnu.zip
          unzip -q /tmp/ast-grep.zip -d /tmp/ast-grep
          sudo mv /tmp/ast-grep/ast-grep /usr/local/bin/
          rm -rf /tmp/ast-grep.zip /tmp/ast-grep
          ast-grep --version
      - name: Install ast-grep (Windows)
        if: runner.os == 'Windows'
        run: |
          curl.exe -sSL -o "$env:TEMP\ast-grep.zip" https://github.com/ast-grep/ast-grep/releases/download/0.45.3/app-x86_64-pc-windows-msvc.zip
          Expand-Archive -Path "$env:TEMP\ast-grep.zip" -DestinationPath "$env:TEMP\ast-grep" -Force
          Copy-Item "$env:TEMP\ast-grep\ast-grep.exe" -Destination "C:\Windows\System32\"
          Remove-Item "$env:TEMP\ast-grep.zip", "$env:TEMP\ast-grep" -Recurse -Force
          ast-grep --version
      - run: cargo test --locked --all-features
      - run: cargo build --locked --release
      - run: cargo run --locked --release -- benchmark --quick --json
      - run: cargo run --locked --release -- benchmark --torture --json
      - run: cargo run --locked --release -- --version
      - run: cargo run --locked --release -- doctor
      - run: cargo run --locked --release -- doctor --json
      - run: cargo run --locked --release -- capabilities
      - run: cargo run --locked --release -- capabilities --json --all
      - run: cargo run --locked --release -- examples exact-text-replacement
      - run: cargo run --locked --release -- schema
      - run: cargo run --locked --release -- schema request --json
      - run: cargo run --locked --release -- explain TARGET_AMBIGUOUS --json
      - run: cargo run --locked --release -- suggest Cargo.toml --goal set-value --at package.name
      - run: cargo run --locked --release -- orient --json
      - run: cargo run --locked --release -- help json:set --json
      - run: cargo run --locked --release -- help markdown:replace_section --json
      - run: target/release/threadmoth completions bash > threadmoth.bash
      - run: cargo run --locked --release -- manpage --output threadmoth.1
      - run: cargo run --locked --release -- benchmark tough --json
      - run: cargo run --locked --release -- torture --json
      - run: cargo run --locked --release -- --help
