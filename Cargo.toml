[package]
name = "threadmoth"
version = "1.10.0"
edition = "2021"
rust-version = "1.85"
default-run = "threadmoth"
autobins = false
description = "Deterministic, source-preserving file mutation for AI agents"
license = "MIT"
repository = "https://github.com/matthewjameswatkins1978-cyber/Threadmoth"
homepage = "https://github.com/matthewjameswatkins1978-cyber/Threadmoth"
keywords = ["file-mutation", "automation", "json", "toml", "cli"]
categories = ["command-line-utilities", "config"]

[[bin]]
name = "threadmoth"
path = "src/threadmoth_cli.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "1.2"
thiserror = "1.0"
sha2 = "0.10"
similar = { version = "2.6", features = ["bytes"] }
toml_edit = "0.22"
atomic-write-file = "0.3.1"
regex = "1.11"
memchr = "2.7"
tree-sitter = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23.2"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-go = "0.25"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-bash = "0.25.1"
tree-sitter-powershell = "0.26.4"
tree-sitter-sequel = "0.3.11"
tree-sitter-html = "0.23.2"
tree-sitter-css = "0.25.0"
tree-sitter-xml = "0.7.0"
tree-sitter-java = "0.23.5"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-php = "0.24.2"
tree-sitter-hcl = "1.1.0"
tree-sitter-yaml = "0.7.2"
serde_yaml = "0.9"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
clap_mangen = "0.2"
self_update = { version = "1.3", default-features = false, features = ["github", "manifest", "reqwest", "rustls", "compression-tar-gz", "compression-zip-deflate", "checksums"] }
semver = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true

[profile.maxperf]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
incremental = false
debug = false
strip = "symbols"
